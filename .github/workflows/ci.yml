name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make bootstrap
      - run: make test
      - if: github.event_name == 'pull_request'
        run: make check-frozen BASE=origin/${{ github.base_ref }}
